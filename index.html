function renderDays(vm){
  const filtered = filterEntries(vm.list, { query: X.query, categoryId: X.cat }, catNameOf);
  if (!filtered.length) {
    return h("p", { class: "x-none", dir: "rtl", text: vm.list.length ? "لا توجد نتائج مطابقة." : "لا توجد مصاريف في هذه الدورة بعد. اضغط + لإضافة مصروف." });
  }
  const panel = h("section", { class: "panel x-panel" });
  for (const d of groupByDay(filtered)) {
    panel.append(h("div", { class: "x-dayhead" },
      h("h3", { dir: "rtl", text: safeDayLabel(d.date, vm.today) }),
      h("span", { class: "x-daytot" }, money(d.spent), d.extra > 0 ? h("span", { class: "x-dayinc" }, "+", money(d.extra)) : null)));
    const ul = h("ul", { class: "x-rows" });
    for (const e of d.entries) ul.append(entryRow(e, vm));
    panel.append(ul);
  }
  return panel;
}
function entryRow(e, vm){
  const c = catOf(e.categoryId), inc = e.type === "income";
  const nm = e.name || c.name;
  const li = h("li", { class: "x-row" + (inc ? " inc" : "") },
    h("span", { class: "x-emoji", "aria-hidden": "true", text: c.emoji }),
    h("div", { class: "x-main" },
      h("div", { class: "x-name", dir: "auto", text: nm }),
      e.name && e.name !== c.name ? h("div", { class: "x-cat", dir: "rtl", text: c.name }) : null),
    h("span", { class: "x-amt" + (inc ? " plus" : "") }, inc ? "+" : null, money(Number(e.amount) || 0)),
    h("div", { class: "x-acts" },
      h("button", { class: "ab", type: "button", "aria-label": "تعديل " + nm, onclick: () => openEntrySheet(e), text: "✎" }),
      h("button", { class: "ab", type: "button", "aria-label": "نسخ " + nm + " بتاريخ اليوم", onclick: () => duplicateEntry(e), text: "⧉" }),
      h("button", { class: "ab", type: "button", "aria-label": "حذف " + nm, onclick: () => softDelete(e), text: "×" })));
  return li;
}
function jumpTo(entry){
  const exp = EXP();
  const accId = entryAccountId(exp, entry);
  const acc = exp.accounts.find(a => a.id === accId);
  if (acc && !acc.archived) exp.lastAccountId = acc.id;
  X.cycleKey = cycleKeyForDate(acc || curAccount(), entry.date);
  X.sub = "list"; X.query = ""; X.cat = "";
}
function softDelete(e){
  e.deletedAt = Date.now();
  scheduleSave();
  renderExp();
  showToast("حُذف «" + (e.name || catNameOf(e.categoryId)) + "»", { label: "تراجع", fn: () => { delete e.deletedAt; scheduleSave(); renderExp(); } });
}
function duplicateEntry(e){
  const copy = Object.assign({}, e, { id: uid(), date: todayStr(), createdAt: Date.now() });
  delete copy.deletedAt; delete copy.updatedAt;
  EXP().entries.push(copy);
  jumpTo(copy);
  scheduleSave();
  renderExp();
  showToast(["نُسخ بتاريخ اليوم: ", money(Number(copy.amount) || 0)], { label: "تراجع", fn: () => {
    const x = EXP().entries; x.splice(x.indexOf(copy), 1); scheduleSave(); renderExp();
  } });
}

/* ================= entry sheet (amount, then one tap on a category) ================= */
function openEntrySheet(editing, preset){
  const exp = EXP();
  const today = todayStr();
  const startAcc = editing ? (exp.accounts.find(a => a.id === entryAccountId(exp, editing)) || curAccount()) : curAccount();
  const f = editing
    ? { type: editing.type === "income" ? "income" : "expense", name: editing.name || "", categoryId: editing.categoryId, date: editing.date, accountId: startAcc.id }
    : { type: (preset && preset.type) || "expense", name: "", categoryId: null, date: (preset && preset.date) || today, accountId: startAcc.id };
  openSheet(editing ? "تعديل" : "إضافة", (body, ctx) => {
    const bExp = h("button", { class: "seg-b", type: "button", text: "مصروف" });
    const bInc = h("button", { class: "seg-b", type: "button", text: "دخل إضافي" });
    const setType = t => { f.type = t; bExp.setAttribute("aria-pressed", String(t === "expense")); bInc.setAttribute("aria-pressed", String(t === "income")); };
    bExp.addEventListener("click", () => setType("expense"));
    bInc.addEventListener("click", () => setType("income"));
    setType(f.type);

    const amount = h("input", { class: "x-amount", type: "text", inputmode: "decimal", autocomplete: "off", autocapitalize: "off", autocorrect: "off",
      enterkeyhint: "done", dir: "ltr", placeholder: "0", "aria-label": "المبلغ", value: editing ? String(editing.amount) : "" });
    const hint = h("div", { class: "x-hint", role: "alert", dir: "rtl" });
    amount.addEventListener("input", () => {
      const n = toLatinDigits(amount.value).replace(/٫/g, ".").replace(/،/g, ",");
      if (n !== amount.value) amount.value = n;
      hint.textContent = "";
    });
    amount.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); amount.blur(); } });

    const note = h("div", { class: "x-note", dir: "rtl" });
    const nameIn = h("input", { class: "field", type: "text", dir: "auto", placeholder: "الاسم (يُستخدم اسم الفئة إن تُرك فارغًا)", "aria-label": "الاسم", value: f.name,
      oninput: () => { f.name = nameIn.value; } });
    const dateIn = h("input", { class: "field", type: "date", dir: "ltr", "aria-label": "التاريخ", value: isValidDate(f.date) ? f.date : "",
      onchange: () => { f.date = dateIn.value; refreshNote(); } });
    const setDate = d => { f.date = d; dateIn.value = d; refreshNote(); };
    const chips = h("div", { class: "chips" },
      h("button", { class: "chip", type: "button", text: "اليوم", onclick: () => setDate(today) }),
      h("button", { class: "chip", type: "button", text: "أمس", onclick: () => setDate(addDays(today, -1)) }),
      h("button", { class: "chip", type: "button", text: "اختيار تاريخ", onclick: () => { dateIn.focus(); try { if (dateIn.showPicker) dateIn.showPicker(); } catch (e) {} } }));
    const acctSel = h("select", { class: "field", dir: "rtl", "aria-label": "الحساب", onchange: () => { f.accountId = acctSel.value; refreshNote(); } });
    for (const a of exp.accounts.filter(x => !x.archived || x.id === f.accountId)) acctSel.append(h("option", { value: a.id, selected: a.id === f.accountId, text: a.name }));

    function refreshNote(){
      const acc = exp.accounts.find(a => a.id === f.accountId) || startAcc;
      note.className = "x-note";
      if (!isValidDate(f.date)) { note.textContent = "تاريخ غير صالح، اختر تاريخًا صحيحًا."; note.classList.add("bad"); return; }
      const c = cycleForDate(acc.cycles, f.date);
      let where;
      if (c) { const b = cycleBounds(acc.cycles, c); where = "ضمن الدورة: " + shortArabicDate(b.start) + " ← " + (b.lastDay ? shortArabicDate(b.lastDay) : "الآن"); }
      else where = acc.cycles.length ? "قبل أول دورة، ستظهر في «بدون دورة»" : "لا توجد دورات بعد، ستظهر في «بدون دورة»";
      const day = dayLabel(f.date, today);
      if (f.date === today) note.textContent = "التاريخ: اليوم · " + where;
      else { note.textContent = "سيُسجَّل بتاريخ: " + day + (day === fullArabicDate(f.date) ? "" : " (" + fullArabicDate(f.date) + ")") + " · " + where; note.classList.add("warn"); }
    }
    const options = h("div", { class: "x-options", hidden: true }, nameIn, chips, dateIn, exp.accounts.filter(a => !a.archived).length > 1 || editing ? acctSel : null);
    const optBtn = h("button", { class: "x-optbtn", type: "button", "aria-expanded": "false", text: "خيارات: الاسم، التاريخ، الحساب",
      onclick: () => { const open = options.hidden; options.hidden = !open; optBtn.setAttribute("aria-expanded", String(open)); } });
    if (editing || f.date !== today) { options.hidden = false; optBtn.setAttribute("aria-expanded", "true"); }

    const grid = h("div", { class: "cat-grid", role: "group", "aria-label": "الفئة" });
    const visible = exp.categories.filter(c => !c.hidden || (editing && c.id === editing.categoryId));
    function paint(){ for (const b of grid.children) b.setAttribute("aria-pressed", String(b.dataset.id === f.categoryId)); }
    for (const c of visible) {
      grid.append(h("button", { class: "cat", type: "button", "data-id": c.id, "aria-pressed": "false", onclick: () => {
        f.categoryId = c.id;
        nameIn.placeholder = c.name;
        paint();
        if (!editing) commit();
      } }, h("span", { class: "e", "aria-hidden": "true", text: c.emoji }), h("span", { class: "n", dir: "rtl", text: c.name })));
    }
    paint();

    function commit(){
      const v = parseEntryAmount(amount.value);
      if (v === null) { hint.textContent = "أدخل مبلغًا صحيحًا أكبر من صفر."; amount.focus(); return; }
      if (!isValidDate(f.date)) { options.hidden = false; optBtn.setAttribute("aria-expanded", "true"); hint.textContent = "تاريخ غير صالح."; return; }
      if (!f.categoryId) { hint.textContent = "اختر فئة."; return; }
      const nm = f.name.trim();
      let entry;
      if (editing) {
        Object.assign(editing, { type: f.type, amount: v, name: nm, categoryId: f.categoryId, date: f.date, accountId: f.accountId, updatedAt: Date.now() });
        entry = editing;
      } else {
        entry = newEntry({ type: f.type, amount: v, name: nm, categoryId: f.categoryId, date: f.date, accountId: f.accountId }, uid(), Date.now());
        exp.entries.push(entry);
      }
      jumpTo(entry);
      scheduleSave();
      ctx.close(true);
      renderExp();
      const accName = (exp.accounts.find(a => a.id === f.accountId) || {}).name;
      showToast([(editing ? "حُفظ التعديل: " : (f.type === "income" ? "أُضيف دخل: " : "أُضيف: ")), money(v),
                 exp.accounts.filter(a => !a.archived).length > 1 && accName ? h("span", { dir: "auto", text: " · " + accName }) : null]);
    }

    body.append(
      h("div", { class: "seg", role: "group", "aria-label": "النوع" }, bExp, bInc),
      h("div", { class: "x-amtrow" }, amount, h("span", { class: "x-unit", dir: "rtl", text: AED })),
      hint, note, optBtn, options, grid,
      editing ? h("div", { class: "toolbar" }, h("button", { class: "pill primary", type: "button", text: "حفظ", onclick: commit })) : null);
    refreshNote();
    amount.focus({ preventScroll: true });
    if (editing) { try { amount.select(); } catch (e) {} }
  });
}
fabAdd.addEventListener("click", () => openEntrySheet(null));

/* ================= cycle sheet ("salary arrived" / edit) ================= */
function openCycleSheet(opts){
  const acc = curAccount();
  const editing = opts.cycle || null;
  const live = liveEntries(accountEntries(EXP(), acc.id));
  openSheet(editing ? "تعديل الدورة" : "وصل الراتب", (body, ctx) => {
    const dateIn = h("input", { class: "field", type: "date", dir: "ltr", "aria-label": "تاريخ وصول الراتب (بداية الدورة)", value: editing ? editing.startDate : opts.date });
    const allowIn = h("input", { class: "field", type: "text", inputmode: "decimal", dir: "ltr", autocomplete: "off", "aria-label": "المبلغ المخصَّص للمصاريف", placeholder: "0",
      value: editing ? String(editing.allowance) : (opts.allowance ? String(opts.allowance) : "") });
    const nextIn = h("input", { class: "field", type: "date", dir: "ltr", "aria-label": "تاريخ الراتب القادم المتوقع (اختياري)", value: editing && editing.expectedNextSalaryDate ? editing.expectedNextSalaryDate : "" });
    const err = h("div", { class: "x-note bad", role: "alert", dir: "rtl", hidden: true });
    const impact = h("div", { class: "x-note", dir: "rtl", hidden: true });
    function showImpact(){
      impact.hidden = true;
      if (!editing || !isValidDate(dateIn.value) || dateIn.value === editing.startDate) return;
      const n = movedEntryCount(acc.cycles, live, editing.id, dateIn.value);
      impact.hidden = false;
      impact.textContent = n ? "بهذا التغيير ستنتقل " + n + " من المصاريف بين الدورات تلقائيًا." : "لن تنتقل أي مصاريف بين الدورات.";
    }
    dateIn.addEventListener("change", showImpact);
    function fail(msg){ err.hidden = false; err.textContent = msg; }
    function save(){
      err.hidden = true;
      const date = dateIn.value;
      if (!isValidDate(date)) return fail("اختر تاريخًا صحيحًا.");
      const allowance = parseAllowance(allowIn.value);
      if (allowance === null) return fail("أدخل مبلغًا صحيحًا للمخصَّص (يمكن أن يكون 0).");
      const next = nextIn.value || "";
      if (next && (!isValidDate(next) || next <= date)) return fail("تاريخ الراتب القادم يجب أن يكون بعد بداية الدورة.");
      const v = validateCycleDate(acc.cycles, date, editing ? editing.id : undefined);
      if (!v.ok) return fail(v.error === "duplicate" ? "توجد دورة أخرى بنفس هذا التاريخ. اختر تاريخًا مختلفًا أو عدّل تلك الدورة." : "تاريخ غير صالح.");
      let id;
      if (editing) {
        const r = setCycleDate(acc.cycles, editing.id, date);
        if (!r.ok) return fail("تعذّر حفظ الدورة.");
        acc.cycles = r.cycles.map(c => {
          if (c.id !== editing.id) return c;
          const n = Object.assign({}, c, { allowance: allowance });
          if (next) n.expectedNextSalaryDate = next; else delete n.expectedNextSalaryDate;
          return n;
        });
        id = editing.id;
      } else {
        const c = { id: uid(), startDate: date, allowance: allowance };
        if (next) c.expectedNextSalaryDate = next;
        const r = addCycle(acc.cycles, c);
        if (!r.ok) return fail("تعذّر حفظ الدورة.");
        acc.cycles = r.cycles;
        id = c.id;
      }
      X.cycleKey = id; X.sub = "list";
      scheduleSave();
      ctx.close(true);
      renderExp();
      showToast(editing ? "حُفظت الدورة" : "بدأت دورة جديدة من " + shortArabicDate(date, true));
    }
    body.append(
      h("label", { class: "flabel", dir: "rtl" }, h("span", { text: "تاريخ وصول الراتب (بداية الدورة)" }), dateIn),
      h("label", { class: "flabel", dir: "rtl" }, h("span", { text: "المبلغ المخصَّص للمصاريف" }), allowIn),
      h("label", { class: "flabel", dir: "rtl" }, h("span", { text: "تاريخ الراتب القادم المتوقع (اختياري)" }), nextIn),
      h("button", { class: "chip", type: "button", text: "مسح الراتب القادم", onclick: () => { nextIn.value = ""; } }),
      h("p", { class: "hint", dir: "rtl", text: "الدورة تنتهي عند بداية الدورة التي بعدها. المبلغ المخصَّص منفصل تمامًا عن دفتر الميزانية." }),
      impact, err,
      h("div", { class: "toolbar" },
        h("button", { class: "pill primary", type: "button", text: "حفظ", onclick: save }),
        editing ? h("button", { class: "pill", type: "button", text: "حذف الدورة", onclick: () => {
          if (!confirm("حذف هذه الدورة؟ مصاريفها لن تُحذف، بل ستنتقل تلقائيًا إلى الدورة السابقة (أو «بدون دورة»).")) return;
          acc.cycles = acc.cycles.filter(c => c.id !== editing.id);
          X.cycleKey = null; scheduleSave(); ctx.close(true); renderExp(); showToast("حُذفت الدورة، والمصاريف محفوظة");
        } }) : null));
    dateIn.focus({ preventScroll: true });
  });
}

/* ================= menus: more, accounts, categories, deleted ================= */
function menuBtn(text, fn, sub){
  return h("button", { class: "menu-b", type: "button", onclick: fn }, h("span", { dir: "rtl", text: text }), sub ? h("span", { class: "sub", dir: "rtl", text: sub }) : null);
}
function openMoreMenu(){
  const delCount = deletedEntries(EXP().entries).length;
  openSheet("المزيد", (body) => {
    body.append(
      menuBtn("المحذوفات", openDeletedSheet, delCount ? String(delCount) : "لا شيء"),
      menuBtn("الحسابات", openAccountsSheet),
      menuBtn("الفئات", openCategoriesSheet),
      menuBtn("الإعدادات والبيانات", openSettingsSheet));
  });
}
function addAccount(){
  const name = (prompt("اسم الحساب الجديد:") || "").trim();
  if (!name) return false;
  const a = { id: uid(), name: name, archived: false, cycles: [] };
  EXP().accounts.push(a);
  EXP().lastAccountId = a.id;
  X.cycleKey = null;
  scheduleSave();
  return true;
}
function openAccountsSheet(){
  openSheet("الحسابات", (body, ctx) => {
    const list = h("ul", { class: "m-list" });
    function fill(){
      list.replaceChildren();
      const exp = EXP();
      const activeCount = exp.accounts.filter(a => !a.archived).length;
      for (const a of exp.accounts) {
        list.append(h("li", { class: "m-row" + (a.archived ? " off" : "") },
          h("span", { class: "m-name", dir: "auto", text: a.name + (a.archived ? " (مؤرشف)" : "") }),
          h("button", { class: "ab", type: "button", "aria-label": "إعادة تسمية " + a.name, text: "✎", onclick: () => {
            const n = (prompt("الاسم الجديد:", a.name) || "").trim(); if (!n) return; a.name = n; scheduleSave(); fill(); renderExp(); } }),
          h("button", { class: "chip", type: "button", text: a.archived ? "استعادة" : "أرشفة", onclick: () => {
            if (!a.archived) {
              if (activeCount <= 1) { alert("لا يمكن أرشفة آخر حساب نشط."); return; }
              if (!confirm("أرشفة «" + a.name + "»؟ يُخفى من القوائم وتبقى بياناته محفوظة ويمكن استعادته.")) return;
            }
            a.archived = !a.archived;
            if (a.archived && EXP().lastAccountId === a.id) EXP().lastAccountId = exp.accounts.find(x => !x.archived).id;
            X.cycleKey = null; scheduleSave(); fill(); renderExp();
          } })));
      }
    }
    fill();
    body.append(list, h("div", { class: "toolbar" }, h("button", { class: "pill primary", type: "button", text: "+ حساب", onclick: () => { if (addAccount()) { fill(); renderExp(); } } })));

/* ================= stats (inline SVG, no libraries) ================= */
function svg(tag, attrs){
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const k of Object.keys(attrs || {})) el.setAttribute(k, String(attrs[k]));
  for (let i = 2; i < arguments.length; i++) { const kid = arguments[i]; if (kid) el.append(typeof kid === "string" ? document.createTextNode(kid) : kid); }
  return el;
}
function statCard(title, kids){
  return h("section", { class: "panel x-stat" }, h("h3", { class: "x-sh", dir: "rtl", text: title }), kids);
}
function renderStats(vm){
  const spentList = expenseList(vm.list);
  const total = sumMoney(spentList.map(e => Number(e.amount) || 0));
  const extra = sumMoney(vm.list.filter(e => e.type === "income").map(e => Number(e.amount) || 0));
  let firstDay, endDay, days;
  if (vm.cycle) {
    const s = cycleSummary(vm.acc.cycles, vm.cycle, vm.live, vm.today);
    firstDay = s.start; endDay = s.lastDay || vm.today; days = Math.max(1, s.daysElapsed);
    if (endDay < firstDay) endDay = firstDay;
  } else {
    const ds = vm.list.map(e => e.date).filter(isValidDate).sort();
    firstDay = ds[0] || vm.today; endDay = ds[ds.length - 1] || vm.today; days = Math.max(1, daysBetween(firstDay, endDay) + 1);
  }
  const frag = document.createDocumentFragment();
  frag.append(h("section", { class: "panel x-stat" },
    h("div", { class: "totals" },
      tline("إجمالي المصروف", money(total, "val")),
      tline("المتوسط اليومي", money(roundMoney(total / days), "val")),
      extra > 0 ? tline("دخل إضافي", money(extra, "val")) : null)));
  if (!spentList.length) { frag.append(h("p", { class: "x-none", dir: "rtl", text: "لا توجد مصاريف في هذه الدورة لعرض الإحصاءات." })); return frag; }

  /* category donut */
  const cats = categoryTotals(vm.list);
  const R = 42, CIRC = 2 * Math.PI * R;
  const donut = svg("svg", { viewBox: "0 0 120 120", class: "donut", role: "img", "aria-label": "توزيع المصروف حسب الفئة" });
  donut.append(svg("circle", { cx: 60, cy: 60, r: R, fill: "none", stroke: "var(--border)", "stroke-width": 18 }));
  let off = 0;
  cats.forEach((c, i) => {
    const len = CIRC * (c.total / total);
    donut.append(svg("circle", { cx: 60, cy: 60, r: R, fill: "none", stroke: SLICE_COLORS[i % SLICE_COLORS.length], "stroke-width": 18,
      "stroke-dasharray": len.toFixed(2) + " " + (CIRC - len).toFixed(2), "stroke-dashoffset": (-off).toFixed(2), transform: "rotate(-90 60 60)" }));
    off += len;
  });
  const t = svg("text", { x: 60, y: 65, "text-anchor": "middle", class: "donut-t" }, formatMoney(total));
  donut.append(t);
  const legend = h("ul", { class: "legend" }, cats.map((c, i) => h("li", null,
    h("span", { class: "dot", style: "background:" + SLICE_COLORS[i % SLICE_COLORS.length] }),
    h("span", { class: "lg-n", dir: "auto", text: catOf(c.categoryId).emoji + " " + catOf(c.categoryId).name }),
    h("bdi", { class: "lg-p", dir: "ltr", text: c.pct + "%" }),
    money(c.total))));
  frag.append(statCard("حسب الفئة", h("div", { class: "donut-wrap" }, donut, legend)));

  /* last 7 days */
  const ld = lastDays(vm.list, firstDay, endDay, 7);
  const maxV = Math.max.apply(null, ld.map(d => d.total).concat([1]));
  const bw = 280 / ld.length;
  const bars = svg("svg", { viewBox: "0 0 280 130", class: "bars", role: "img", "aria-label": "المصروف في آخر 7 أيام" });
  ld.forEach((d, i) => {
    const ht = Math.round(80 * d.total / maxV);
    const x = i * bw + bw * 0.18, w = bw * 0.64;
    bars.append(svg("rect", { x: x.toFixed(1), y: 100 - ht, width: w.toFixed(1), height: Math.max(ht, d.total > 0 ? 2 : 0), rx: 3, class: "bar" + (d.date === vm.today ? " today" : "") }));
    if (d.total > 0) bars.append(svg("text", { x: (x + w / 2).toFixed(1), y: 95 - ht, "text-anchor": "middle", class: "bar-v" }, formatMoney(d.total)));
    bars.append(svg("text", { x: (x + w / 2).toFixed(1), y: 118, "text-anchor": "middle", class: "bar-l" }, String(parseDate(d.date).d)));
  });
  frag.append(statCard("آخر 7 أيام", bars));

  /* trend over the last 6 cycles */
  if (vm.cycle) {
    const tr = cycleTrend(vm.acc.cycles, vm.live, vm.cycle.id, 6);
    if (tr.length >= 1) {
      const mx = Math.max.apply(null, tr.map(p => p.total).concat([1]));
      const step = tr.length > 1 ? 240 / (tr.length - 1) : 0;
      const pts = tr.map((p, i) => [20 + (tr.length > 1 ? i * step : 120), 100 - Math.round(70 * p.total / mx)]);
      const line = svg("svg", { viewBox: "0 0 280 140", class: "trend", role: "img", "aria-label": "إجمالي المصروف في آخر 6 دورات" });
      if (pts.length > 1) line.append(svg("polyline", { points: pts.map(p => p.join(",")).join(" "), fill: "none", class: "tl" }));
      tr.forEach((p, i) => {
        const pd = parseDate(p.start);
        line.append(svg("circle", { cx: pts[i][0], cy: pts[i][1], r: i === tr.length - 1 ? 5 : 3.5, class: "tp" + (i === tr.length - 1 ? " last" : "") }));
        line.append(svg("text", { x: pts[i][0], y: pts[i][1] - 9, "text-anchor": "middle", class: "bar-v" }, formatMoney(p.total)));
        line.append(svg("text", { x: pts[i][0], y: 128, "text-anchor": "middle", class: "bar-l" }, pd.d + "/" + pd.m));
      });
      frag.append(statCard("اتجاه آخر 6 دورات", line));
    }
    /* biggest category changes vs the previous cycle */
    const ch = categoryChanges(vm.acc.cycles, vm.live, vm.cycle.id).slice(0, 6);
    const prevExists = vm.sorted.findIndex(c => c.id === vm.cycle.id) > 0;
    frag.append(statCard("أكبر التغيّرات عن الدورة السابقة", !prevExists
      ? h("p", { class: "x-none", dir: "rtl", text: "لا توجد دورة سابقة للمقارنة." })
      : (ch.length ? h("ul", { class: "chg" }, ch.map(c => h("li", { class: "chg-" + c.kind },
          h("span", { class: "x-emoji", "aria-hidden": "true", text: catOf(c.categoryId).emoji }),
          h("span", { class: "lg-n", dir: "auto", text: catOf(c.categoryId).name }),
          h("span", { class: "tag", dir: "rtl", text: c.kind === "new" ? "جديد" : (c.kind === "up" ? "ارتفاع" : "انخفاض") }),
          h("span", { class: "money val", dir: "ltr" }, h("bdi", { class: "n", text: (c.delta > 0 ? "+" : "") + formatMoney(c.delta) }), h("span", { class: "u", dir: "rtl", text: AED })))))
        : h("p", { class: "x-none", dir: "rtl", text: "لا تغييرات تُذكر." }))));
  }
  return frag;
}

/* ================= receipt image (canvas, paper style) ================= */
const RCPT_W = 560;
function expReceiptLayout(ctx, draw, m){
  const W = RCPT_W, pad = 40, teeth = 12, COL = pad + 190;      /* amounts end at COL; Arabic text starts at the right edge */
  const INK = "#24231F", DIMK = "#77736A", RULE = "#B5AE9F", NEG = "#B8473F", GRN = "#38594A";
  let y = teeth + 44;
  const font = (w, s, fam) => w + " " + s + "px " + fam;
  /* Arabic pass: right-to-left, anchored at the right edge */
  function arabic(text, size, weight, color, align, x, maxW){
    if (!draw) return;
    ctx.font = font(weight, size, AR_FONT);
    ctx.fillStyle = color; ctx.direction = "rtl"; ctx.textAlign = align || "right";
    let t = text;
    if (maxW) { while (t.length > 1 && ctx.measureText(t).width > maxW) t = t.slice(0, -1); if (t !== text) t = t.replace(/\s+$/, "") + "…"; }
    ctx.fillText(t, x != null ? x : W - pad, y);
  }
  /* number pass: left-to-right, number and unit drawn separately so bidi can never mix them */
  function amount(v, size, weight, color, withUnit){
    if (!draw) return;
    ctx.fillStyle = color; ctx.direction = "ltr"; ctx.textAlign = "right";
    let x = COL;
    if (withUnit !== false) {
      ctx.font = font(weight, Math.round(size * 0.8), AR_FONT);
      ctx.direction = "rtl";
      ctx.fillText(AED, x, y);
      x -= ctx.measureText(AED).width + 5;
      ctx.direction = "ltr";
    }
    ctx.font = font(weight, size, NUM_FONT);
    ctx.fillText(typeof v === "string" ? v : formatMoney(v), x, y);
  }
  function plain(text, size, color, align, x){
    if (!draw) return;
    ctx.font = font(400, size, NUM_FONT); ctx.fillStyle = color; ctx.direction = "ltr"; ctx.textAlign = align; ctx.fillText(text, x, y);
  }
  function rule(dashed){
    if (!draw) return;
    ctx.strokeStyle = RULE; ctx.lineWidth = 1; ctx.setLineDash(dashed ? [2, 4] : []);
    ctx.beginPath(); ctx.moveTo(pad, y); ctx.lineTo(W - pad, y); ctx.stroke(); ctx.setLineDash([]);
  }
  arabic(m.accountName, 26, 700, INK, "center", W / 2, W - 2 * pad); y += 30;
  arabic("إيصال المصاريف", 17, 500, DIMK, "center", W / 2); y += 26;
  if (m.start) {
    arabic("الفترة", 15, 500, DIMK); plain(m.start + "  →  " + m.end, 15, INK, "left", pad); y += 24;
  } else { arabic("مصاريف بدون دورة", 15, 500, DIMK); y += 24; }
  plain(new Date().toLocaleDateString("en-GB"), 13, DIMK, "center", W / 2); y += 22;
  rule(true); y += 28;
  if (m.start) { arabic("المخصَّص", 18, 600, INK); amount(m.allowance, 18, 600, INK); y += 26; }
  if (m.extra > 0) { arabic("دخل إضافي", 16, 500, INK); amount(m.extra, 16, 500, GRN); y += 26; }
  if (m.start || m.extra > 0) { y += 2; rule(true); y += 28; }
  if (m.categories.length) {
    arabic("حسب الفئة", 18, 700, INK); y += 28;
    for (const c of m.categories) {
      arabic(c.name, 16, 400, INK, "right", W - pad, W - 2 * pad - 230);
      amount(c.total, 16, 500, INK);
      plain(c.pct + "%", 13, DIMK, "left", pad);
      y += 25;
    }
    y += 2; rule(true); y += 28;
  }
  for (const d of m.days) {
    arabic(isValidDate(d.date) ? d.label : "تاريخ غير صالح", 16, 700, INK, "right", W - pad, W - 2 * pad - 230);
    amount(d.spent, 16, 700, INK);
    y += 25;
    for (const e of d.entries) {
      arabic(e.name || "—", 15, 400, e.type === "income" ? GRN : INK, "right", W - pad, W - 2 * pad - 230);
      amount((e.type === "income" ? "+" : "") + formatMoney(e.amount), 15, 500, e.type === "income" ? GRN : INK);
      y += 23;
    }
    y += 6;
  }
  y += 4; rule(false); y += 32;
  arabic("إجمالي المصروف", 18, 700, INK); amount(m.spent, 20, 700, INK); y += 36;
  arabic("المتبقي", 20, 700, INK); amount(m.remaining, 28, 700, m.remaining < 0 ? NEG : GRN); y += 18;
  y += 8; rule(false); y += 2; rule(false);
  return y + 34 + teeth;
}
function drawExpReceipt(m){
  const W = RCPT_W, teeth = 12, toothW = 16;
  const probe = document.createElement("canvas").getContext("2d");
  const H = Math.ceil(expReceiptLayout(probe, false, m));
  /* retina x2, capped so very long receipts stay inside the browser's canvas size limits */
  let scale = (window.devicePixelRatio || 1) * 2;
  scale = Math.max(1, Math.min(scale, Math.sqrt(14000000 / (W * H)), 16000 / H, 16000 / W));
  const canvas = document.createElement("canvas");
  canvas.width = Math.floor(W * scale);
  canvas.height = Math.floor(H * scale);
  const ctx = canvas.getContext("2d");
  ctx.scale(scale, scale);
  ctx.beginPath();
  ctx.moveTo(0, teeth);
  for (let x = 0; x < W; x += toothW) { ctx.lineTo(x + toothW / 2, 0); ctx.lineTo(Math.min(x + toothW, W), teeth); }
  ctx.lineTo(W, H - teeth);
  for (let x = W; x > 0; x -= toothW) { ctx.lineTo(x - toothW / 2, H); ctx.lineTo(Math.max(x - toothW, 0), H - teeth); }
  ctx.closePath();
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#FFFCF5"); g.addColorStop(1, "#F5F2EA");
  ctx.fillStyle = g; ctx.fill();
  ctx.save(); ctx.clip();
  expReceiptLayout(ctx, true, m);
  ctx.restore();
  return canvas;
}
async function makeExpReceipt(vm){
  try {
    if (document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch (e) {} }
    const m = buildReceiptModel(EXP(), vm.acc.id, vm.key, vm.today);
    const canvas = drawExpReceipt(m);
    const name = "expenses-" + (m.start || "none") + ".png";
    canvas.toBlob(async blob => {
      if (!blob) { alert("تعذّر إنشاء صورة الإيصال (الصورة كبيرة جدًا)."); return; }
      const file = new File([blob], name, { type: "image/png" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file], title: m.accountName + " — إيصال المصاريف" }); return; }
        catch (e) { if (e && e.name === "AbortError") return; }
      }
      /* no share sheet: full-screen image with a long-press hint and a download link, never nothing */
      const url = URL.createObjectURL(blob);
      document.getElementById("overlayImg").src = url;
      const dl = document.getElementById("overlayDl");
      dl.href = url; dl.download = name;
      overlay.classList.add("on");
    }, "image/png");
  } catch (e) { alert("تعذّر إنشاء الإيصال."); }
}


/* ================= section tabs ================= */
const TAB_IDS = ["ledger", "exp"];
function showTab(id){
  for (const t of TAB_IDS) {
    const on = t === id;
    const btn = document.querySelector('.tab[data-tab="' + t + '"]');
    btn.setAttribute("aria-selected", String(on));
    btn.tabIndex = on ? 0 : -1;
    document.getElementById(t === "ledger" ? "viewLedger" : "viewExp").hidden = !on;
  }
  topHeader.classList.toggle("on-exp", id === "exp");
  fabAdd.hidden = id !== "exp";
  if (id === "exp") renderExp();
  try { LS.setItem(TAB_KEY, id); } catch (e) { /* a remembered tab is only a convenience */ }
  window.scrollTo(0, 0);
}
for (const btn of document.querySelectorAll(".tab")) {
  btn.addEventListener("click", () => showTab(btn.dataset.tab));
  btn.addEventListener("keydown", e => {
    if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
    const next = btn.dataset.tab === "ledger" ? "exp" : "ledger";
    showTab(next);
    document.querySelector('.tab[data-tab="' + next + '"]').focus();
  });
}

/* ================= boot ================= */
renderAll();
try { const t = LS.getItem(TAB_KEY); if (t === "exp") showTab("exp"); } catch (e) { /* default tab */ }
bootSafety();
</script>
