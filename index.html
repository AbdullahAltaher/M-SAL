/* Drag the grabber down: the sheet follows the finger, closes past 30% of its height or on a fast flick, else springs back. */
function enableSheetDrag(s){
  const grab = s.sheet.querySelector(".sheet-grab");
  if (!grab) return;
  let y0 = null, last = 0, lastT = 0, vel = 0;
  const dyOf = e => Math.max(0, e.clientY - y0);
  grab.addEventListener("pointerdown", e => {
    if (s !== sheetState || s.opening || getComputedStyle(grab).display === "none") return;
    y0 = e.clientY; last = e.clientY; lastT = performance.now(); vel = 0;
    try { grab.setPointerCapture(e.pointerId); } catch (err) { /* older browsers */ }
    s.back.classList.add("drag");
  });
  grab.addEventListener("pointermove", e => {
    if (y0 === null) return;
    const dy = dyOf(e), now = performance.now();
    if (now > lastT) { vel = (e.clientY - last) / (now - lastT); last = e.clientY; lastT = now; }
    s.sheet.style.transform = "translateY(" + (dy - (s.lift || 0)) + "px)";
    s.back.style.setProperty("--dim", String(Math.max(0, 1 - dy / (s.sheet.offsetHeight || 1))));
  });
  const release = (e, cancelled) => {
    if (y0 === null) return;
    const dy = cancelled ? 0 : dyOf(e), h = s.sheet.offsetHeight || 1;
    y0 = null;
    s.back.classList.remove("drag");
    void s.sheet.offsetHeight;                              /* transitions are back on before the transform is cleared */
    s.sheet.style.transform = "";
    if (!cancelled && (dy > h * 0.3 || (vel > 0.6 && dy > 8))) closeSheet();

}
/* build(body, {close}) fills the sheet. opts: opener (element to refocus on close), keepFocus (leave focus where it is, e.g. on the
   keyboard proxy), onOpened (runs when the slide has finished). */
function openSheet(title, build, opts){
  opts = opts || {};
  if (closingSheet) finishClose(closingSheet);
  closeSheet(true, true);
  const opener = opts.opener || document.activeElement;
  const body = h("div", { class: "sheet-body" });
  /* sheet builders pass optional children (null): the native append() would print the word "null", so skip empties */
  body.append = function(){ appendKid(body, Array.prototype.slice.call(arguments)); };
  const sheet = h("div", { class: "sheet", role: "dialog", "aria-modal": "true", "aria-label": title, tabindex: "-1" },
    h("div", { class: "sheet-grab", "aria-hidden": "true" }),
    h("div", { class: "sheet-head" },
      h("h2", { class: "sheet-title", dir: "rtl", text: title }),
      h("button", { class: "icon-btn sheet-x", type: "button", "aria-label": "إغلاق", onclick: () => closeSheet() },
        h("span", { class: "sx-glyph", "aria-hidden": "true", text: "×" }), h("span", { class: "sx-text", text: "إلغاء" }))),
    body);
  const back = h("div", { class: "sheet-back", onclick: e => { if (e.target === back) closeSheet(); } }, sheet);
  sheetHost.append(back);
  document.documentElement.classList.add("noscroll");
  sheetState = { back: back, sheet: sheet, opener: opener, onClose: opts.onClose, onOpened: opts.onOpened, opening: true, lift: 0 };
  if (!opts.keepFocus) sheet.focus({ preventScroll: true });
  sheet.addEventListener("focusin", () => { setTimeout(ensureVisible, 60); setTimeout(ensureVisible, 340); });
  enableSheetDrag(sheetState);
  build(body, { close: closeSheet, sheet: sheet });
  void sheet.offsetHeight;                                   /* the starting position (below the screen) is painted, then it slides in */
  back.classList.add("on");
  const st = sheetState;
  st.openTimer = setTimeout(() => finishOpen(st), reducedMotion() ? 160 : OPEN_MS + 30);
  return st;
}

document.addEventListener("keydown", e => {
  if (!sheetState) return;
  if (e.key === "Escape") { e.preventDefault(); closeSheet(); return; }

/* A section that collapses to nothing and expands again by animating its height. It clips its content only WHILE animating

function collapsible(inner, open){
  const el = h("div", { class: "g-col" }, inner);
  let isOpen = !!open, timer = null;
  function set(o, animate){
    isOpen = !!o;
    clearTimeout(timer);
    el.classList.toggle("open", isOpen);
    el.inert = !isOpen;
    el.setAttribute("aria-hidden", String(!isOpen));
    if (!animate) { el.style.height = isOpen ? "auto" : "0px"; el.classList.remove("anim"); return; }
    el.classList.add("anim");
    if (isOpen) el.style.height = inner.scrollHeight + "px";
    else { el.style.height = el.offsetHeight + "px"; void el.offsetHeight; el.style.height = "0px"; }
    timer = setTimeout(() => { el.classList.remove("anim"); if (isOpen) el.style.height = "auto"; }, 260);
  }
  set(isOpen, false);
  return { el: el, set: set, get open(){ return isOpen; } };
}

    function refresh(){

        entry = editing;
      } else {
        entry = newEntry({ type: f.type, amount: v, name: nm, categoryId: f.categoryId, date: f.date, accountId: f.accountId }, uid(), Date.now());
        exp.entries.push(entry);
      }
      jumpTo(entry);
      scheduleSave();
      ctx.close(true);
      renderExp();
      const accName = (exp.accounts.find(a => a.id === f.accountId) || {}).name;
      showToast([(editing ? "حُفظ التعديل: " : (f.type === "income" ? "أُضيف دخل: " : "أُضيف: ")), money(v),

      descCol.el,

      multi ? h("div", { class: "g-sec" }, optBtn, options) : null,
      hint,
      h("div", { class: "g-savebar" }, saveBtn));
    paintDate();
    refreshNote();

    if (f.categoryId) { updateRow(); paintSugg(); }
    refresh();
  }, {

      const field = sheetState && sheetState.sheet.querySelector(".x-amount");

    }

/* ================= cycle sheet ("salary arrived" / edit) ================= */
function openCycleSheet(opts){
  const acc = curAccount();
  const editing = opts.cycle || null;
  const live = liveEntries(accountEntries(EXP(), acc.id));
  openSheet(editing ? "تعديل الدورة" : "وصل الراتب", (body, ctx) => {
    const dateIn = h("input", { class: "field", type: "date", dir: "ltr", "aria-label": "تاريخ وصول الراتب (بداية الدورة)", value: editing ? editing.startDate : opts.date });
    const allowIn = h("input", { class: "field", type: "text", inputmode: "decimal", dir: "ltr", autocomplete: "off", "aria-label": "المبلغ المخصَّص للمصاريف", placeholder: "0",
      value: editing ? String(editing.allowance) : (opts.allowance ? String(opts.allowance) : "") });
    const nextIn = h("input", { class: "field", type: "date", dir: "ltr", "aria-label": "تاريخ الراتب القادم المتوقع (اختياري)", value: editing && editing.expectedNextSalaryDate ? editing.expectedNextSalaryDate : "" });
    const err = h("div", { class: "x-note bad", role: "alert", dir: "rtl", hidden: true });
    const impact = h("div", { class: "x-note", dir: "rtl", hidden: true });
    function showImpact(){
      impact.hidden = true;
      if (!editing || !isValidDate(dateIn.value) || dateIn.value === editing.startDate) return;
      const n = movedEntryCount(acc.cycles, live, editing.id, dateIn.value);
      impact.hidden = false;
      impact.textContent = n ? "بهذا التغيير ستنتقل " + n + " من المصاريف بين الدورات تلقائيًا." : "لن تنتقل أي مصاريف بين الدورات.";
    }
    dateIn.addEventListener("change", showImpact);
    function fail(msg){ err.hidden = false; err.textContent = msg; }
    function save(){
      err.hidden = true;
      const date = dateIn.value;
      if (!isValidDate(date)) return fail("اختر تاريخًا صحيحًا.");
      const allowance = parseAllowance(allowIn.value);
      if (allowance === null) return fail("أدخل مبلغًا صحيحًا للمخصَّص (يمكن أن يكون 0).");
      const next = nextIn.value || "";
      if (next && (!isValidDate(next) || next <= date)) return fail("تاريخ الراتب القادم يجب أن يكون بعد بداية الدورة.");
      const v = validateCycleDate(acc.cycles, date, editing ? editing.id : undefined);
      if (!v.ok) return fail(v.error === "duplicate" ? "توجد دورة أخرى بنفس هذا التاريخ. اختر تاريخًا مختلفًا أو عدّل تلك الدورة." : "تاريخ غير صالح.");
      let id;
      if (editing) {
        const r = setCycleDate(acc.cycles, editing.id, date);
        if (!r.ok) return fail("تعذّر حفظ الدورة.");
        acc.cycles = r.cycles.map(c => {
          if (c.id !== editing.id) return c;
          const n = Object.assign({}, c, { allowance: allowance });
          if (next) n.expectedNextSalaryDate = next; else delete n.expectedNextSalaryDate;
          return n;
        });
        id = editing.id;
      } else {
        const c = { id: uid(), startDate: date, allowance: allowance };
        if (next) c.expectedNextSalaryDate = next;
        const r = addCycle(acc.cycles, c);
        if (!r.ok) return fail("تعذّر حفظ الدورة.");
        acc.cycles = r.cycles;
        id = c.id;
      }
      X.cycleKey = id;
      scheduleSave();
      ctx.close(true);
      renderExp();
      showToast(editing ? "حُفظت الدورة" : "بدأت دورة جديدة من " + shortArabicDate(date, true));
    }
    body.append(
      h("label", { class: "flabel", dir: "rtl" }, h("span", { text: "تاريخ وصول الراتب (بداية الدورة)" }), dateIn),
      h("label", { class: "flabel", dir: "rtl" }, h("span", { text: "المبلغ المخصَّص للمصاريف" }), allowIn),
      h("label", { class: "flabel", dir: "rtl" }, h("span", { text: "تاريخ الراتب القادم المتوقع (اختياري)" }), nextIn),
      h("button", { class: "chip", type: "button", text: "مسح الراتب القادم", onclick: () => { nextIn.value = ""; } }),
      h("p", { class: "hint", dir: "rtl", text: "الدورة تنتهي عند بداية الدورة التي بعدها. المبلغ المخصَّص منفصل تمامًا عن دفتر الميزانية." }),
      impact, err,
      h("div", { class: "toolbar" },
        h("button", { class: "pill primary", type: "button", text: "حفظ", onclick: save }),
        editing ? h("button", { class: "pill", type: "button", text: "حذف الدورة", onclick: () => {
          if (!confirm("حذف هذه الدورة؟ مصاريفها لن تُحذف، بل ستنتقل تلقائيًا إلى الدورة السابقة (أو «بدون دورة»).")) return;
          acc.cycles = acc.cycles.filter(c => c.id !== editing.id);
          X.cycleKey = null; scheduleSave(); ctx.close(true); renderExp(); showToast("حُذفت الدورة، والمصاريف محفوظة");
        } }) : null));
    dateIn.focus({ preventScroll: true });
  });
}

async function makeExpReceipt(vm){
  try {
    if (document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch (e) {} }
    const m = buildReceiptModel(EXP(), vm.acc.id, vm.key, vm.today);
    const canvas = drawExpReceipt(m);
    const name = "expenses-" + (m.start || "none") + ".png";
    canvas.toBlob(async blob => {
      if (!blob) { alert("تعذّر إنشاء صورة الإيصال (الصورة كبيرة جدًا)."); return; }
      const file = new File([blob], name, { type: "image/png" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file], title: m.accountName + " — إيصال المصاريف" }); return; }
        catch (e) { if (e && e.name === "AbortError") return; }
      }
      /* no share sheet: full-screen image with a long-press hint and a download link, never nothing */
      const url = URL.createObjectURL(blob);
      document.getElementById("overlayImg").src = url;
      const dl = document.getElementById("overlayDl");
      dl.href = url; dl.download = name;
      overlay.classList.add("on");
    }, "image/png");
  } catch (e) { alert("تعذّر إنشاء الإيصال."); }
}


/* the status/toolbar colour follows the Expenses background while that tab is open, and goes back for the ledger */
const THEME_META = [...document.querySelectorAll('meta[name="theme-color"]')];
const THEME_ORIG = THEME_META.map(m => m.getAttribute("content"));
function syncThemeColor(on){
  const light = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
  THEME_META.forEach((m, i) => m.setAttribute("content", on ? (light ? "#E3EBF8" : "#0B1426") : THEME_ORIG[i]));
}

/* ================= section tabs ================= */
const TAB_IDS = ["ledger", "exp"];
function showTab(id){
  for (const t of TAB_IDS) {
    const on = t === id;
    const btn = document.querySelector('.tab[data-tab="' + t + '"]');
    btn.setAttribute("aria-selected", String(on));
    btn.tabIndex = on ? 0 : -1;
    document.getElementById(t === "ledger" ? "viewLedger" : "viewExp").hidden = !on;
  }
  topHeader.classList.toggle("on-exp", id === "exp");
  document.body.classList.toggle("x-on", id === "exp");     /* scopes the whole Expenses look; the ledger never sees it */
  syncThemeColor(id === "exp");
  if (id === "exp") renderExp();
  try { LS.setItem(TAB_KEY, id); } catch (e) { /* a remembered tab is only a convenience */ }
  window.scrollTo(0, 0);
}
for (const btn of document.querySelectorAll(".tab")) {
  btn.addEventListener("click", () => showTab(btn.dataset.tab));
  btn.addEventListener("keydown", e => {
    if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
    const next = btn.dataset.tab === "ledger" ? "exp" : "ledger";
    showTab(next);
    document.querySelector('.tab[data-tab="' + next + '"]').focus();
  });
}

/* ================= expenses bar and background ================= */
(function initBar(){
  const names = { home: "home", entries: "list", stats: "chart", more: "more" };
  for (const b of document.querySelectorAll("#xBar [data-v]")) {
    b.append(icon(names[b.dataset.v], 24, b.dataset.v === "more" ? 3 : 1.8));
    b.addEventListener("click", () => { if (b.dataset.v === "more") openMoreMenu(); else setView(b.dataset.v); });
  }
  fabAdd.append(icon("plus", 30, 2.2));
  /* the slow background drift pauses while the page is hidden */
  const sync = () => document.documentElement.classList.toggle("x-paused", document.hidden);
  document.addEventListener("visibilitychange", sync);
  sync();
})();

/* ================= boot ================= */
renderAll();
try { const t = LS.getItem(TAB_KEY); if (t === "exp") showTab("exp"); } catch (e) { /* default tab */ }
bootSafety();
</script>
